<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AutoCars - AutoDrive Quality Vehicles</title>
    <meta name="description" content="Discover exceptional vehicles, explore inventory, and enquire about cars with AutoDrive." />
    <meta property="og:title" content="AutoCars - AutoDrive Quality Vehicles" />
    <meta property="og:description" content="Discover exceptional vehicles, explore inventory, and enquire about cars with AutoDrive." />
    <script>
      (function() {
        try {
          var originalFetch = window.fetch ? window.fetch.bind(window) : undefined;
          var currentFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return currentFetch;
            },
            set: function(val) {
              currentFetch = val;
            }
          });
        } catch (_) {}

        window.addEventListener('error', function(event) {
          if (
            (event && event.message && event.message.indexOf('Cannot set property fetch') !== -1) ||
            (event && event.filename && event.filename.indexOf('chrome-extension://') !== -1)
          ) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
